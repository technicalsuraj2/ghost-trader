[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-auto-trader-controller"
version = "0.1.0"
description = "A desktop controller for an already logged-in MetaTrader 5 terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["MetaTrader5==5.0.6147"]
license = {text = "MIT"}
keywords = ["metatrader5", "mt5", "trading", "desktop"]

[project.scripts]
mt5-auto-trader = "mt5_control_app:main"

[tool.setuptools]
py-modules = ["mt5_control_app"]
