[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-auto-trader-controller"
version = "0.1.0"
description = "Ghost Trader - Kali Linux launcher and MT5 auto trade controller."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
keywords = ["metatrader5", "mt5", "trading", "desktop"]

[project.optional-dependencies]
windows = ["MetaTrader5==5.0.6147"]

[project.scripts]
mt5-auto-trader = "mt5_control_app:main"
ghost-trader = "ghost_trader:main"

[tool.setuptools]
py-modules = ["mt5_control_app", "ghost_trader"]
